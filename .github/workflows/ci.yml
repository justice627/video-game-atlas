name: CI
# Every pull request and every push to main: the data rules, quotes against evidence, the gate,
# unit tests, typecheck and build, and the browser tests. The job is named `ci`: the ruleset on
# main requires it (with data-guard) before anything merges.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Data rules (validate)
        run: npm run build:data
      - name: Quotes against committed evidence
        run: npm run verify:sources -- --offline
      - name: Gate (every auto-verified link still passes)
        run: npm run gate -- --check
      - name: Unit tests, including golden examples
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Typecheck, build and browser tests
        run: npm run test:e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
