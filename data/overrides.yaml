  Q12060881: { label: Chinese Empire, from: -221, to: 1912 }
  Q17134047: { label: present day, from: release, to: release }
  Q92136810: { label: near future, from: 2030, to: 2100 }
  Q125475226: { label: post-apocalypse, from: 2030, to: 3000 }
  Q12681445: { label: "1476", from: 1476, to: 1476 }
  Q3733063: { label: Viking expansion, from: 793, to: 1066 }
  Q170148: { label: Ragnarök (Viking Age myth), from: 793, to: 1066 }
  Q5782830: { label: Muisca Confederation, from: 600, to: 1540 }
  Q11768: { label: Ancient Egypt, from: -3100, to: -30 }

games:
