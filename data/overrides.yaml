# periods: Wikidata period items that carry no dates, mapped to a year range.
#   Negative years are BCE. `release` means "the game's release year".
# games: per-game patches keyed by Wikidata QID.

periods:
  Q11756: { label: prehistory, from: -3000000, to: -3000 }
  Q344: { label: future, from: 2030, to: 3000 }
