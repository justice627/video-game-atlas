# Netlify builds deploy previews for pull requests and production for main.
# Tests run first: a failing test or invalid data (validate() in scripts/lib/dataset.ts)
# fails the deploy. Production builds that change only data, docs or review files are
# skipped by scripts/netlify-ignore.sh to save build credits; the scheduled data deploy
# (Monday and Thursday, via a build hook) publishes them.
[build]
  command = "npm test && npm run build"
  publish = "dist"
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/atlas.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
