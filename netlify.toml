# Netlify builds a deploy preview for every pull request (free). Production builds run only
# when .github/workflows/deploy.yml calls the build hook (Monday and Thursday, or by hand);
# scripts/netlify-ignore.sh skips every other production build, because the Free plan's 300
# credits are a hard limit and each production deploy costs 15. Tests run first: a failing
# test or invalid data (validate() in scripts/lib/dataset.ts) fails the deploy.
[build]
  command = "npm test && npm run build"
  publish = "dist"
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/atlas.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
