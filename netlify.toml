# Netlify builds every push to the production branch (main) and every pull request
# as a deploy preview. Tests run first; a failing test or an invalid dataset
# (anything other than exactly 400 games) fails the deploy.
[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/atlas.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
